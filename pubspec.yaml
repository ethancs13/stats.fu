name: stats.fu
description: "stats.fu — free, open-source Spotify stats. All stats.fm features, no paywalls."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.6.3

  # HTTP
  dio: ^5.7.0

  # Auth (manual PKCE — more reliable than flutter_appauth on Android)
  flutter_secure_storage: ^9.2.2
  app_links: ^6.3.0
  crypto: ^3.0.0

  # Local database
  drift: ^2.23.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.5
  path: ^1.9.0

  # Charts & visualizations
  fl_chart: ^0.70.0

  # Images
  cached_network_image: ^3.4.1

  # Animations
  shimmer: ^3.0.0
  lottie: ^3.2.0
  animations: ^2.0.11
  flutter_animate: ^4.5.2

  # Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # File import (optional Spotify data export)
  file_picker: ^8.1.7

  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.3.4
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.23.0
  riverpod_generator: ^2.4.3
  freezed: ^3.0.0
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
